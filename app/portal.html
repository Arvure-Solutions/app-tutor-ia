<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor IA · Plataforma de aprendizaje</title>
<style>
  :root{--bg:#0f1115;--card:#161b27;--card2:#1c2230;--fg:#e7e9ee;--mut:#9aa4b2;
        --acc:#4f8cff;--acc2:#7c5cff;--ok:#5fd38a;--bord:#222a3a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
       color:var(--fg);min-height:100vh}
  header{padding:2.4rem 1.2rem 1rem;text-align:center;background:linear-gradient(180deg,#141a26,#0f1115)}
  h1{font-size:1.7rem;margin:0 0 .3rem;background:linear-gradient(90deg,var(--acc),var(--acc2));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .bienvenida{color:var(--mut);font-size:1.05rem;margin:.2rem 0 1.2rem}
  .buscador{max-width:560px;margin:0 auto 2rem;display:flex;gap:.5rem}
  .buscador input{flex:1;padding:.8rem 1rem;border-radius:10px;border:1px solid var(--bord);
       background:var(--card);color:var(--fg);font-size:1rem}
  .buscador button{padding:.8rem 1.2rem;border:0;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));
       color:#fff;font-weight:700;cursor:pointer}
  .grid{max-width:900px;margin:0 auto;padding:0 1.2rem 3rem;display:grid;
       grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
  .dom{cursor:pointer;background:var(--card);border:1px solid var(--bord);border-radius:14px;
       padding:1.2rem 1rem;text-align:center;transition:.15s}
  .dom:hover{transform:translateY(-3px);border-color:var(--acc);background:var(--card2)}
  .dom .ic{font-size:2rem}
  .dom .nm{font-weight:700;margin:.4rem 0 .2rem}
  .dom .ds{color:var(--mut);font-size:.82rem;min-height:2.4em}
  .pill{display:inline-block;font-size:.7rem;color:var(--mut);background:#0f1115;
        border:1px solid var(--bord);border-radius:999px;padding:1px 8px;margin:2px}
  footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1rem}
  .oculto{display:none}
</style></head>
<body>
<header>
  <h1>🧠 Tutor IA</h1>
  <div class="bienvenida" id="bienvenida">¿Qué querés aprender hoy?</div>
  <div class="buscador">
    <input id="tema" placeholder="escribí lo que quieras aprender: guitarra, durlock, edición...">
    <button onclick="generar()">Aprender</button>
  </div>
</header>

<main class="grid" id="dominios"></main>

<div id="loading" class="oculto" style="text-align:center;color:var(--mut);padding:2rem">
  Generando tu curso con videos reales de YouTube… ⏳
</div>

<footer>Plataforma de aprendizaje · motor BKT/FSRS · contenido desde YouTube + IA</footer>

<script>
const api = async (p, body) => {
  const r = await fetch('/api/'+p, {method: body?'POST':'GET',
    headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):null});
  return r.json();
};
async function cargar(){
  const c = await api('catalogo');
  document.getElementById('bienvenida').textContent = c.bienvenida || '¿Qué querés aprender hoy?';
  const g = document.getElementById('dominios'); g.innerHTML='';
  c.dominios.forEach(d=>{
    const el=document.createElement('div'); el.className='dom';
    el.innerHTML=`<div class="ic">${d.icono}</div><div class="nm">${d.nombre}</div>
      <div class="ds">${d.descripcion}</div>
      <div>${(d.ejemplos||[]).map(e=>`<span class="pill">${e}</span>`).join('')}</div>`;
    el.onclick=()=>{document.getElementById('tema').value=d.nombre; generar(d.id);};
    g.appendChild(el);
  });
}
async function generar(dominio){
  const tema=document.getElementById('tema').value.trim();
  if(!tema){alert('Escribí qué querés aprender'); return;}
  document.getElementById('loading').classList.remove('oculto');
  document.getElementById('dominios').classList.add('oculto');
  try{
    const r=await api('generar',{tema, dominio});
    if(r.error){alert(r.error); return;}
    location.href=`curso.html?slug=${encodeURIComponent(r.slug)}`;
  }catch(e){alert('Error generando: '+e);}
}
cargar();
</script>
</body></html>
